
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Find project and prepare ImGui
        shell: pwsh
        run: |
          if (Test-Path "CMakeLists.txt") {
            $project = "."
          } elseif (Test-Path "DDS-Injector/CMakeLists.txt") {
            $project = "DDS-Injector"
          } else {
            throw "CMakeLists.txt not found"
          }

          "PROJECT_DIR=$project" >> $env:GITHUB_ENV

          $nested = Join-Path $project "vendor/imgui/imgui-master"
          $target = Join-Path $project "vendor/imgui"

          if (Test-Path "$nested/imgui.cpp") {
            Copy-Item "$nested/*" $target -Recurse -Force
          }

      - name: Configure CMake
        run: cmake -S "${{ github.workspace }}/${{ env.PROJECT_DIR }}" -B build -A x64

      - name: Build EXE
        run: cmake --build build --config Release --parallel

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DDS-Injector-Windows-x64
          path: build/Release/DDS-Injector.exe
          if-no-files-found: error
